# ESMValTool
# recipe_ind_ocean_compare.yml
---
documentation:
  title: |
    Metrics for the Indian Ocean. 

  description: |
    Recipe for calculating the Dipole Mode Index. 

  authors:
    - righi_mattia

datasets:
   - {dataset: HadGEM3-GC31-MM, project: CMIP6, exp: historical, ensemble: r1i1p1f3, start_year: 1960, end_year: 2010, grid: gn}
   - {dataset: HadGEM3-GC31-LL, project: CMIP6, exp: historical, ensemble: r1i1p1f3, start_year: 1960, end_year: 2010, grid: gn}
#   - {dataset: MPI-ESM1-2-LR, project: CMIP6, mip: Omon, exp: historical, ensemble: r1i1p1f1, start_year: 1960, end_year: 2010, grid: gn}
   #   - {dataset: MPI-ESM1-2-LR, project: CMIP6, mip: Amon, exp: historical, ensemble: r1i1p1f1, start_year: 1960, end_year: 2010, grid: gn}
   
   #- {dataset: CNRM-CM5, project: CMIP5, start_year: 1960, end_year: 2010, ensemble: r1i1p1, exp: historical}
#  - {dataset: CNRM-CM5, project: CMIP5, start_year: 2020, end_year: 2075, ensemble: r1i1p1, exp: rcp85}

preprocessors:

  global_anomalies_2d_seas:
    detrend:
      method: linear
    regrid:
      target_grid: 1x1
      scheme: linear
    anomalies:
      period: month
      reference:
        start_year: 1981
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false
    seasonal_statistics:
      operator: mean
    custom_order: true

  global_anomalies_surface_seas:
    extract_levels:
      levels: [100000.]
      scheme: linear
    detrend:
      method: linear
    regrid:
      target_grid: 1x1
      scheme: linear
    anomalies:
      period: month
      reference:
        start_year: 1981
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false
    seasonal_statistics:
      operator: mean
    custom_order: true

  global_anomalies_2d_pr_seas:
    detrend:
      method: linear
    regrid:
      target_grid: 1x1
      scheme: linear
    anomalies:
      period: month
      reference:
        start_year: 1981
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false
    seasonal_statistics:
      operator: mean
    convert_units:
      units: mm day-1  
    custom_order: true

  global_anomalies_pr:
    detrend:
      method: linear
    regrid:
      target_grid: 1x1
      scheme: linear
    anomalies:
      period: month
      reference:
        start_year: 1981
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false
    convert_units:
      units: mm day-1  
    custom_order: true
       

  west_pole_anomalies_seas:
    extract_region:
      start_longitude: 50
      end_longitude: 70
      start_latitude: -10
      end_latitude: 10
    area_statistics:
      operator: mean
    detrend:
      method: linear
    anomalies:
      period: month
      reference:
        start_year: 1981
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false
    seasonal_statistics:
      operator: mean
    extract_season:
      season: SON
    regrid_time:
      calendar: gregorian
      units: days since 1900-01-01
    custom_order: true

  east_pole_anomalies_seas:
    extract_region:
      start_longitude: 90
      end_longitude: 110
      start_latitude: -10
      end_latitude: 0
    area_statistics:
      operator: mean
    detrend:
      method: linear
    anomalies:
      period: month
      reference:
        start_year: 1981
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false
    seasonal_statistics:
      operator: mean
    extract_season:
      season: SON
    regrid_time:
      calendar: gregorian
      units: days since 1900-01-01
    custom_order: true
  west_pole_anomalies_monthly:
    extract_region:
      start_longitude: 50
      end_longitude: 70
      start_latitude: -10
      end_latitude: 10
    area_statistics:
      operator: mean
    detrend:
      method: linear
    anomalies:
      period: month
      reference:
        start_year: 1981
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false
    regrid_time:
      calendar: gregorian
      units: days since 1900-01-01
    custom_order: true

  east_pole_anomalies_monthly:
    extract_region:
      start_longitude: 90
      end_longitude: 110
      start_latitude: -10
      end_latitude: 0
    area_statistics:
      operator: mean
    detrend:
      method: linear
    anomalies:
      period: month
      reference:
        start_year: 1981
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false
    regrid_time:
      calendar: gregorian
      units: days since 1900-01-01
    custom_order: true

  west_pole_abs:
    extract_region:
      start_longitude: 50
      end_longitude: 70
      start_latitude: -10
      end_latitude: 10
    area_statistics:
      operator: mean
    regrid_time:
      calendar: gregorian
      units: days since 1900-01-01
    convert_units:
      units: celsius    

  east_pole_abs:
    extract_region:
      start_longitude: 90
      end_longitude: 110
      start_latitude: -10
      end_latitude: 0
    area_statistics:
      operator: mean
    regrid_time:
      calendar: gregorian
      units: days since 1900-01-01
    convert_units:
      units: celsius   

  nino_3.4_anomalies_seas:
    extract_region:
      start_longitude: -170
      end_longitude: -120
      start_latitude: -5
      end_latitude: 5
    area_statistics:
      operator: mean
    detrend:
      method: linear
    anomalies:
      period: season
      reference:
        start_year: 1981
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false
    seasonal_statistics:
      operator: mean
    extract_season:
      season: DJF
    regrid_time:
      calendar: gregorian
      units: days since 1900-01-01
    custom_order: true
  nino_3.4_anomalies_monthly:
    extract_region:
      start_longitude: -170
      end_longitude: -120
      start_latitude: -5
      end_latitude: 5
    area_statistics:
      operator: mean
    detrend:
      method: linear
    anomalies:
      period: month
      reference:
        start_year: 1981
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false
    regrid_time:
      calendar: gregorian
      units: days since 1900-01-01
    custom_order: true

  extract_eq_region:
    extract_region:
      start_longitude: 0
      end_longitude: 360
      start_latitude: -2
      end_latitude: 2    
    extract_volume:
      z_min: 0.
      z_max: 200.
      interval_bounds: 'closed'
    convert_units:
      units: celsius
    climate_statistics:
      operator: mean
      period: season

  east_pole_abs_surface:
    extract_region:
      start_longitude: 90
      end_longitude: 110
      start_latitude: -10
      end_latitude: 0
    extract_levels:
      levels: [100000.]
      scheme: linear
    area_statistics:
      operator: mean
    regrid_time:
      calendar: gregorian
      units: days since 1900-01-01

  extract_sctr_region:
    extract_region:
      start_longitude: 50
      end_longitude: 70
      start_latitude: -10
      end_latitude: -5
    extract_volume:
      z_min: 0.
      z_max: 200.
      interval_bounds: 'closed'
    convert_units:
      units: celsius
    climate_statistics:
      operator: mean
      period: monthly

